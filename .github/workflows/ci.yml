name: ci
on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - run: pip install ruff
      - run: ruff check .
      - run: ruff format --check .

  test:
    runs-on: ubuntu-latest
    services:
      mariadb:
        image: mariadb:10.6
        env:
          MYSQL_ROOT_PASSWORD: root
        ports:
          - 3306:3306
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval=5s --health-timeout=5s --health-retries=20
      redis:
        image: redis:7
        ports:
          - 6379:6379
    env:
      SITE: test.localhost
    steps:
      - uses: actions/checkout@v4
        with:
          path: wayforpay
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - uses: actions/setup-node@v4
        with:
          node-version: 18
      - name: Install bench
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q libmariadb-dev
          pip install frappe-bench
          bench init --skip-redis-config-generation --skip-assets --frappe-branch version-15 --python "$(which python)" ~/frappe-bench
      - name: Create the site and install the apps
        working-directory: /home/runner/frappe-bench
        run: |
          bench set-config -g db_host 127.0.0.1
          bench set-config -g redis_cache redis://127.0.0.1:6379/0
          bench set-config -g redis_queue redis://127.0.0.1:6379/1
          bench set-config -g redis_socketio redis://127.0.0.1:6379/2
          bench get-app --skip-assets --branch version-15 https://github.com/frappe/payments
          bench get-app --skip-assets "$GITHUB_WORKSPACE/wayforpay"
          bench new-site "$SITE" --mariadb-root-password root --admin-password admin --no-mariadb-socket
          bench --site "$SITE" set-config allow_tests true
          bench --site "$SITE" install-app payments wayforpay
      - name: Run the tests
        working-directory: /home/runner/frappe-bench
        run: bench --site "$SITE" run-tests --app wayforpay
